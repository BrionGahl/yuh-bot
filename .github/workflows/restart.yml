name: Restart Cloud Run

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Restart Cloud Run service
        # The bot keeps a live Discord gateway connection and in-memory state, and is pinned to
        # exactly one instance (see deploy.yml), so there's no "restart" verb for it directly.
        # Updating a label with no other change forces Cloud Run to roll a new revision from the
        # same image, which restarts the container without a rebuild/redeploy.
        run: |
          gcloud run services update gulp-bot \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --update-labels=restarted-at=$(date +%s) \
            --quiet
